name: 'Terraform Destroy'

# 1. Protect the workflow by requiring a manual trigger
on:
  workflow_dispatch:

jobs:
  terraform-destroy:
    name: 'Terraform Destroy'
    runs-on: ubuntu-latest

    # 2. Inject environment variables for cloud authentication
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: 'ap-south-1' # Change to your target region

    steps:
    # 3. Check out the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 3.1 Configure AWS Credentials
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1 # Specify your region

    # 4. Install the Terraform CLI on the runner
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.15.5" # Specify your Terraform version

    # 5. Initialize the backend to pull your state file
    - name: Terraform Init
      working-directory: ./iac/terraform
      run: terraform init

    # 5.5 Import existing resources into local state so destroy knows what to destroy
    - name: Terraform Import
      working-directory: ./iac/terraform
      run: |
        terraform import aws_ecr_repository.tutoragent_ecr_repository tutoragent_ecr_repository || true
        terraform import aws_iam_role.ecsTaskExecutionRole ecsTaskExecutionRole || true
        terraform import aws_iam_role_policy_attachment.ecsTaskExecutionRole_policy ecsTaskExecutionRole/arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy || true
        terraform import aws_ecs_cluster.ecs-cluster-one ecs-cluster-one || true
        terraform import aws_ecs_service.tutoragent-service ecs-cluster-one/tutoragent-service || true  
        SG_ID=$(aws ec2 describe-security-groups --region ap-south-1 --filters Name=group-name,Values=tutoragent-sg --query "SecurityGroups[0].GroupId" --output text)
        if [ "$SG_ID" != "None" ] && [ -n "$SG_ID" ]; then 
          terraform import aws_security_group.tutoragent-sg $SG_ID || true
        fi
        terraform import aws_ecs_task_definition.tutoragent-task tutoragent-task || true

    # 6. Optional: Generate a preview of what will be destroyed
    - name: Terraform Plan Destroy
      working-directory: ./iac/terraform
      run: terraform plan -destroy

    # 7. Execute the destruction immediately without manual prompt
    - name: Terraform Destroy
      working-directory: ./iac/terraform
      run: terraform destroy -auto-approve
